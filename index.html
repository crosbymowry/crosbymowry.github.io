<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crosby Mowry - Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background: linear-gradient(to bottom, #f7cbbd, #a9c3e6);
      color: #1d2d44;
      padding: 40px 60px; /* padding for both left and right sides */
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1600px;
      width: 100%;
    }

    .image-header-group {
      width: 700px;
      margin-bottom: 40px;
    }

    .image-header-group h1 {
      font-size: 4rem;
      margin: 0 0 20px 0;
      text-align: left;
    }

    .main-section {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      gap: 80px;
      flex-wrap: nowrap;
    }

    .hero {
      position: relative;
      width: 700px;
      height: 400px;
      border-radius: 30px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(173, 200, 245, 0.55);
      z-index: 1;
    }

    .hero-text {
      position: absolute;
      bottom: 30px;
      left: 40px;
      color: black;
      font-size: 1.5rem;
      font-weight: bold;
      line-height: 1.5;
      z-index: 2;
    }

    .about-button {
      position: absolute;
      bottom: 30px;
      right: 40px;
      background-color: #f7e4d6;
      border: 2px solid #1d2d44;
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: bold;
      color: #1d2d44;
      text-decoration: none;
      transition: background-color 0.3s;
      z-index: 2;
    }

    .about-button:hover {
      background-color: #e9d4c2;
    }

    .side-buttons {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 400px; /* match image height */
      margin-right: 40px; /* bring buttons in from edge */
    }

    .side-buttons a {
      background-color: #d1d4e6;
      border: 2px solid #1d2d44;
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #1d2d44;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.3s;
      width: 220px; /* slightly smaller */
    }

    .side-buttons a:hover {
      background-color: #c4c7da;
    }

    @media (max-width: 900px) {
      .main-section {
        flex-direction: column;
        align-items: center;
      }

      .side-buttons {
        flex-direction: row;
        gap: 20px;
        height: auto;
        margin-top: 40px;
        margin-right: 0;
        justify-content: center;
      }

      .side-buttons a {
        width: auto;
        padding: 16px 24px;
        font-size: 1rem;
      }

      .image-header-group {
        width: 100%;
        text-align: center;
      }

      .image-header-group h1 {
        text-align: center;
      }
    }

    @media (max-width: 600px) {
      .image-header-group h1 {
        font-size: 2.5rem;
      }

      .hero {
        width: 100%;
        height: 250px;
      }

      .hero-text {
        font-size: 1.1rem;
        left: 20px;
        bottom: 20px;
      }

      .about-button {
        bottom: 20px;
        right: 20px;
        padding: 6px 12px;
      }

      .side-buttons a {
        font-size: 0.9rem;
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="image-header-group">
      <h1>Crosby Mowry</h1>
    </div>

    <div class="main-section">
      <div class="hero">
        <img src="index_image/index_image.jpg" alt="Crosby Portrait" />
        <div class="overlay"></div>
        <div class="hero-text">
          Advertising Designer,<br>
          Music Producer, &<br>
          Voice Actor
        </div>
        <a href="about.html" class="about-button">About Page</a>
      </div>

      <div class="side-buttons">
        <a href="ad-design.html">Ad Design</a>
        <a href="404.html">Voice Over</a>
        <a href="music.html">Music Portfolio</a>
      </div>
    </div>
  </div>

</body>
</html>
