<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Self Portrait</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at center, #ffdab9, #a0c4ff);
      margin: 0;
      padding: 20px;
      font-family: 'Rubik', sans-serif;
      color: #333;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin: 20px 0 10px;
    }

    .gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
      margin: 30px 0;
    }

    .portrait {
      max-width: 610px;
      text-align: center;
    }

    .portrait h2 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .portrait p {
      font-size: 1.1rem;
      color: #555;
      margin-top: 10px;
    }

    iframe {
      border: 3px solid #333;
      border-radius: 8px;
      width: 610px;
      height: 410px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      margin-bottom: 10px;
    }

    .home-button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #88b5f5;
      color: #222;
      text-decoration: none;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      border-radius: 5px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
      transition: background-color 0.3s ease;
      margin-top: 30px;
    }

    .home-button:hover {
      background-color: #265dbe;
    }

    @media (max-width: 1280px) {
      .gallery {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <h1>Self Portraits</h1>

  <div class="gallery">
    <div class="portrait">
      <h2>Static Crosby</h2>
      <iframe 
        src="https://editor.p5js.org/crosbycroz/full/WOpRRdM14" 
        title="Static Self Portrait"></iframe>
    </div>

    <div class="portrait">
      <h2>Motion Crosby</h2>
      <iframe 
        src="https://editor.p5js.org/crosbycroz/full/l2DrSzDgX" 
        title="Animated Self Portrait"></iframe>
      <p>Click for blue pulse</p>
    </div>
  </div>

  <a class="home-button" href="../index.html">Back to Home</a>
</body>
</html>
