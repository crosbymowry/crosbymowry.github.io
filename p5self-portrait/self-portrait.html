<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Self Portrait</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at center, #ffdab9, #a0c4ff);
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Rubik', sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 2.5rem;
      margin: 20px 0 10px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 20px;
      text-align: center;
      max-width: 600px;
    }

    iframe {
      border: 3px solid #333;
      border-radius: 8px;
      width: 610px;
      height: 410px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    .home-button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #88b5f5;
      color: #222;
      text-decoration: none;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      border-radius: 5px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
      transition: background-color 0.3s ease;
    }

    .home-button:hover {
      background-color: #265dbe;
    }
  </style>
</head>
<body>
  <h1>Self Portrait</h1>
  <p>Crosby Mowry</p>

  <iframe 
    src="https://editor.p5js.org/crosbycroz/full/WOpRRdM14" 
    title="Self Portrait Sketch by Crosby Mowry"
    width="610" 
    height="410">
  </iframe>

  <p>
    <a href="https://editor.p5js.org/crosbycroz/full/WOpRRdM14" target="_blank">
    </a>
  </p>

  <a class="home-button" href="../index.html">← Back to Home</a>
</body>
</html>
